<!doctype html>
<html><head><meta charset="utf-8"><title>Catalogue - every part</title></head>
<body>
<main>
  <h2 id="ph">All parts</h2>
  <ul id="parts" aria-labelledby="ph"></ul>
</main>
<script>
// 2,100 items: more than extract.js reads (MAX_ITEMS, 2000), with no count
// on the page, so the total prints as a lower bound.
const ul = document.getElementById('parts');
for (let i = 1; i <= 2100; i++) {
  const li = document.createElement('li');
  li.innerHTML = '<a href="https://parts.example/' + i + '">Replacement part number ' + i + '</a> <span>in stock at the warehouse</span>';
  ul.appendChild(li);
}
</script>
</body></html>
